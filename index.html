<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LYC and JOFC Issuance Log and Check Printing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='75'%3E%E2%91%86%3C/text%3E%3C/svg%3E" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ---------- helpers ----------

const genId = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
const todayISO = () => new Date().toISOString().slice(0, 10);
const money = (n) => (isNaN(n) ? 0 : n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const ONES = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
  "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen",
  "Seventeen", "Eighteen", "Nineteen"];
const TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
const SCALES = ["", "Thousand", "Million", "Billion"];

function threeDigitsToWords(n) {
  let s = "";
  if (n >= 100) {
    s += ONES[Math.floor(n / 100)] + " Hundred";
    n %= 100;
    if (n > 0) s += " ";
  }
  if (n >= 20) {
    s += TENS[Math.floor(n / 10)];
    if (n % 10 > 0) s += "-" + ONES[n % 10];
  } else if (n > 0) {
    s += ONES[n];
  }
  return s;
}

function amountToWords(amount) {
  const whole = Math.floor(Math.abs(amount));
  const cents = Math.round((Math.abs(amount) - whole) * 100);
  let groups = [];
  let n = whole;
  let scaleIdx = 0;
  while (n > 0) {
    const chunk = n % 1000;
    if (chunk > 0) {
      groups.unshift(threeDigitsToWords(chunk) + (SCALES[scaleIdx] ? " " + SCALES[scaleIdx] : ""));
    }
    n = Math.floor(n / 1000);
    scaleIdx++;
  }
  const wholeWords = whole === 0 ? "Zero" : groups.join(" ");
  let result = `${wholeWords} Peso${whole === 1 ? "" : "s"}`;
  if (cents > 0) {
    result += ` and ${threeDigitsToWords(cents)} Centavo${cents === 1 ? "" : "s"}`;
  }
  return `${result} Only`;
}

function padCheckNo(n) { return String(n || 0).padStart(4, "0"); }

function formatCheckDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  return `${m} ${d} ${y}`;
}

// ---------- storage (browser localStorage) ----------

function loadKey(key) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  } catch { return null; }
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* best effort */ }
}

// ---------- icons (feather-style inline SVG, no dependency) ----------

const iconProps = (size) => ({ width: size, height: size, viewBox: "0 0 24 24", fill: "none",
  stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" });

const CreditCard = ({size=16}) => (<svg {...iconProps(size)}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>);
const Users = ({size=16}) => (<svg {...iconProps(size)}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>);
const BookOpen = ({size=16}) => (<svg {...iconProps(size)}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>);
const Printer = ({size=16}) => (<svg {...iconProps(size)}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>);
const Plus = ({size=16}) => (<svg {...iconProps(size)}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>);
const Trash2 = ({size=16}) => (<svg {...iconProps(size)}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>);
const FilePenLine = ({size=16}) => (<svg {...iconProps(size)}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>);
const Search = ({size=16}) => (<svg {...iconProps(size)}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>);
const AlertTriangle = ({size=16}) => (<svg {...iconProps(size)}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>);
const CheckCircle2 = ({size=16}) => (<svg {...iconProps(size)}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>);

// ---------- main app ----------

function CheckWriterApp() {
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("write");
  const [accounts, setAccounts] = useState([]);
  const [payees, setPayees] = useState([]);
  const [log, setLog] = useState([]);
  const [printTarget, setPrintTarget] = useState(null);
  const fileInputRef = useRef(null);
  const [uploadNote, setUploadNote] = useState("");

  useEffect(() => {
    const a = loadKey("cw-accounts");
    const p = loadKey("cw-payees");
    const l = loadKey("cw-log");
    if (a) setAccounts(a);
    if (p) setPayees(p);
    if (l) setLog(l);
    setLoaded(true);
  }, []);

  useEffect(() => { if (loaded) saveKey("cw-accounts", accounts); }, [accounts, loaded]);
  useEffect(() => { if (loaded) saveKey("cw-payees", payees); }, [payees, loaded]);
  useEffect(() => { if (loaded) saveKey("cw-log", log); }, [log, loaded]);

  const selectedAccount = (id) => accounts.find((a) => a.id === id);

  function addAccount(acc) { setAccounts((prev) => [...prev, { ...acc, id: genId() }]); }
  function updateAccount(id, patch) { setAccounts((prev) => prev.map((a) => (a.id === id ? { ...a, ...patch } : a))); }
  function deleteAccount(id) { setAccounts((prev) => prev.filter((a) => a.id !== id)); }

  function addPayee(payee) { setPayees((prev) => [...prev, { ...payee, id: genId() }]); }
  function addPayeesBulk(list) {
    setPayees((prev) => {
      const existingNames = new Set(prev.map((p) => p.name.trim().toLowerCase()));
      const additions = list.filter((p) => p.name && !existingNames.has(p.name.trim().toLowerCase()));
      return [...prev, ...additions];
    });
  }
  function deletePayee(id) { setPayees((prev) => prev.filter((p) => p.id !== id)); }

  function handleFile(file) {
    setUploadNote("");
    const ext = file.name.split(".").pop().toLowerCase();
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        if (ext === "docx") {
          const result = await mammoth.extractRawText({ arrayBuffer: e.target.result });
          const lines = result.value.split("\n").map((l) => l.replace(/\t/g, ",").trim()).filter(Boolean);
          const newPayees = lines.map((line) => {
            const [name, ...rest] = line.split(",");
            return { name: name.trim(), address: rest.join(",").trim() };
          });
          addPayeesBulk(newPayees);
          setUploadNote(`Imported ${newPayees.length} payee(s) from ${file.name}.`);
        } else {
          const wb = XLSX.read(e.target.result, { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
          let startIdx = 0, nameCol = 0, addrCol = -1;
          if (rows.length && rows[0].some((c) => /name|payee/i.test(String(c)))) {
            startIdx = 1;
            rows[0].forEach((c, i) => {
              const s = String(c).toLowerCase();
              if (s.includes("name") || s.includes("payee")) nameCol = i;
              if (s.includes("address")) addrCol = i;
            });
          }
          const newPayees = [];
          for (let i = startIdx; i < rows.length; i++) {
            const row = rows[i];
            const name = row[nameCol];
            if (name && String(name).trim()) {
              newPayees.push({ name: String(name).trim(), address: addrCol >= 0 ? String(row[addrCol] || "").trim() : "" });
            }
          }
          addPayeesBulk(newPayees);
          setUploadNote(`Imported ${newPayees.length} payee(s) from ${file.name}.`);
        }
      } catch (err) {
        setUploadNote(`Couldn't read that file. Try a .xlsx, .csv, or .docx file with one payee per row or line.`);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function issueCheck(record) {
    setLog((prev) => [{ status: "outstanding", datePresented: "", ...record }, ...prev]);
    updateAccount(record.accountId, {
      nextCheckNumber: record.checkNumber + 1,
      balance: typeof record.balanceAfter === "number" ? record.balanceAfter : selectedAccount(record.accountId)?.balance,
    });
  }

  function updateLogEntry(id, patch) {
    setLog((prev) => prev.map((r) => (r.id === id ? { ...r, ...patch } : r)));
  }

  function triggerPrint(target) {
    setPrintTarget(target);
    setTimeout(() => window.print(), 30);
  }

  return (
    <div className="cw-app">
      <style>{STYLE}</style>

      <div className="cw-shell no-print">
        <header className="cw-header">
          <div className="cw-brand">
            <span className="cw-brand-mark">⑆</span>
            <div>
              <h1>LYC and JOFC Issuance Log and Check Printing</h1>
              <p>Check writer, payee register, and issuance log</p>
            </div>
          </div>
        </header>

        <nav className="cw-nav">
          <NavBtn active={tab === "write"} onClick={() => setTab("write")} icon={<FilePenLine size={16} />}>Check Write</NavBtn>
          <NavBtn active={tab === "payees"} onClick={() => setTab("payees")} icon={<Users size={16} />}>Payee Log</NavBtn>
          <NavBtn active={tab === "accounts"} onClick={() => setTab("accounts")} icon={<CreditCard size={16} />}>Check Accounts</NavBtn>
          <NavBtn active={tab === "log"} onClick={() => setTab("log")} icon={<BookOpen size={16} />}>Issuance Log</NavBtn>
        </nav>

        <main className="cw-main">
          {tab === "write" && (
            <CheckWriteTab accounts={accounts} payees={payees} onIssue={issueCheck} onAddPayee={addPayee}
              onPrint={(data) => triggerPrint({ mode: "quick", quick: data })} />
          )}
          {tab === "payees" && (
            <PayeesTab payees={payees} onAdd={addPayee} onDelete={deletePayee} onUpload={handleFile}
              uploadNote={uploadNote} fileInputRef={fileInputRef} />
          )}
          {tab === "accounts" && (
            <AccountsTab accounts={accounts} onAdd={addAccount} onUpdate={updateAccount} onDelete={deleteAccount} />
          )}
          {tab === "log" && (
            <LogTab log={log} accounts={accounts} onUpdateLog={updateLogEntry} onPrintLog={(rows) => triggerPrint({ mode: "log", rows })} />
          )}
        </main>

        <footer className="cw-footer">Saved automatically in this browser.</footer>
      </div>

      <div className="print-area">
        {printTarget?.mode === "log" && <LogPrintable log={printTarget.rows || log} accounts={accounts} />}
        {printTarget?.mode === "quick" && <QuickCheckPrintable data={printTarget.quick} />}
      </div>
    </div>
  );
}

function NavBtn({ active, onClick, icon, children }) {
  return (
    <button className={`cw-nav-btn ${active ? "active" : ""}`} onClick={onClick}>
      {icon}<span>{children}</span>
    </button>
  );
}

// ============ CHECK WRITE TAB ============
// Tracks accounts, payees, check numbers, memos, and balances like a full check writer,
// but only prints Date / Payee / Amount / Amount in words onto pre-printed check stock.

const QUICK_POS_DEFAULT = {
  pageWidth: 203.2, pageHeight: 88.9,
  dateTop: 12, dateLeft: 150,
  payeeTop: 34, payeeLeft: 15,
  amountTop: 34, amountLeft: 160,
  wordsTop: 46, wordsLeft: 15,
};

function CheckWriteTab({ accounts, payees, onIssue, onAddPayee, onPrint }) {
  const [accountId, setAccountId] = useState(accounts[0]?.id || "");
  const [payeeMode, setPayeeMode] = useState("existing");
  const [payeeId, setPayeeId] = useState("");
  const [payeeName, setPayeeName] = useState("");
  const [savePayee, setSavePayee] = useState(true);
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [memo, setMemo] = useState("");
  const [checkNoOverride, setCheckNoOverride] = useState("");
  const [error, setError] = useState("");
  const [lastIssued, setLastIssued] = useState(null);
  const [pos, setPos] = useState(() => ({ ...QUICK_POS_DEFAULT, ...(loadKey("cw-quickprint-pos") || {}) }));
  const [showCalibration, setShowCalibration] = useState(false);

  useEffect(() => { if (!accountId && accounts.length) setAccountId(accounts[0].id); }, [accounts]);
  useEffect(() => { saveKey("cw-quickprint-pos", pos); }, [pos]);

  const account = accounts.find((a) => a.id === accountId);
  const numericAmount = parseFloat(amount);
  const nextCheckNo = checkNoOverride ? parseInt(checkNoOverride, 10) : account?.nextCheckNumber || 1;
  const insufficientFunds = account && typeof account.balance === "number" && !isNaN(numericAmount) && numericAmount > account.balance;
  const words = numericAmount > 0 ? amountToWords(numericAmount) : "";

  function resolvePayeeName() {
    if (payeeMode === "existing") return payees.find((p) => p.id === payeeId)?.name || "";
    return payeeName.trim();
  }

  function setP(field, val) { setPos((p) => ({ ...p, [field]: val === "" ? "" : parseFloat(val) })); }

  function handleSubmit(e) {
    e.preventDefault();
    setError("");
    if (!account) return setError("Choose which check account to draw from.");
    const name = resolvePayeeName();
    if (!name) return setError("Enter or select a payee.");
    if (!amount || isNaN(numericAmount) || numericAmount <= 0) return setError("Enter a valid check amount.");
    if (!date) return setError("Enter a check date.");

    if (payeeMode === "manual" && savePayee) {
      const exists = payees.some((p) => p.name.trim().toLowerCase() === name.toLowerCase());
      if (!exists) onAddPayee({ name, address: "" });
    }

    const record = {
      id: genId(), accountId: account.id, accountName: account.holderName, bankName: account.bankName,
      checkNumber: nextCheckNo, payee: name, amount: numericAmount, amountWords: words,
      date, memo, balanceAfter: typeof account.balance === "number" ? account.balance - numericAmount : undefined,
      issuedAt: new Date().toISOString(),
    };
    onIssue(record);
    setLastIssued(record);
    setAmount(""); setMemo(""); setCheckNoOverride(""); setPayeeName(""); setPayeeId("");
  }

  function handlePrint(record) {
    onPrint({ payee: record.payee, date: record.date, amount: record.amount, words: record.amountWords, pos });
  }

  function handlePrintNow() {
    setError("");
    const name = resolvePayeeName();
    if (!name) return setError("Enter or select a payee before printing.");
    if (!amount || isNaN(numericAmount) || numericAmount <= 0) return setError("Enter a valid amount before printing.");
    if (!date) return setError("Enter a check date before printing.");
    onPrint({ payee: name, date, amount: numericAmount, words, pos });
  }

  if (!accounts.length) {
    return <EmptyState icon={<CreditCard size={28} />} title="No check accounts yet"
      body="Register a check account first so there's something to draw a check against." />;
  }

  return (
    <div className="cw-grid">
      <form className="cw-card" onSubmit={handleSubmit}>
        <h2>New Check</h2>
        <p className="cw-hint">Tracks the account, payee, and balance as usual — but only prints Date, Payee, Amount, and Amount in words onto the check, sized for a standard Philippine check (8&quot; × 3.5&quot;), since the rest is already pre-printed on the paper.</p>

        <label className="cw-label">Check account</label>
        <select className="cw-select" value={accountId} onChange={(e) => setAccountId(e.target.value)}>
          {accounts.map((a) => (
            <option key={a.id} value={a.id}>{a.holderName} — {a.bankName} (…{String(a.accountNumber).slice(-4)})</option>
          ))}
        </select>
        {account && typeof account.balance === "number" && (
          <p className="cw-hint">Available balance: ₱{money(account.balance)}</p>
        )}

        <label className="cw-label">Payee</label>
        <div className="cw-toggle">
          <button type="button" className={payeeMode === "existing" ? "active" : ""} onClick={() => setPayeeMode("existing")}>From payee log</button>
          <button type="button" className={payeeMode === "manual" ? "active" : ""} onClick={() => setPayeeMode("manual")}>Type a name</button>
        </div>
        {payeeMode === "existing" ? (
          <select className="cw-select" value={payeeId} onChange={(e) => setPayeeId(e.target.value)}>
            <option value="">Select a payee…</option>
            {payees.map((p) => (<option key={p.id} value={p.id}>{p.name}</option>))}
          </select>
        ) : (
          <>
            <input className="cw-input" value={payeeName} onChange={(e) => setPayeeName(e.target.value)} placeholder="Payee name" />
            <label className="cw-check-label">
              <input type="checkbox" checked={savePayee} onChange={(e) => setSavePayee(e.target.checked)} /> Save to payee log
            </label>
          </>
        )}

        <div className="cw-row">
          <div>
            <label className="cw-label">Amount</label>
            <input className="cw-input" type="number" step="0.01" min="0" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" />
          </div>
          <div>
            <label className="cw-label">Date</label>
            <input className="cw-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
        </div>

        <div className="cw-row">
          <div>
            <label className="cw-label">Check number</label>
            <input className="cw-input" placeholder={String(account?.nextCheckNumber || 1)} value={checkNoOverride} onChange={(e) => setCheckNoOverride(e.target.value)} />
          </div>
          <div>
            <label className="cw-label">Memo (optional)</label>
            <input className="cw-input" value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="e.g. Invoice #1042" />
          </div>
        </div>

        {words && <p className="cw-words">{words}</p>}
        {insufficientFunds && <p className="cw-warn"><AlertTriangle size={14} /> This exceeds the account's available balance.</p>}
        {error && <p className="cw-error">{error}</p>}

        <div className="cw-actions">
          <button type="submit" className="cw-btn primary"><CheckCircle2 size={16} /> Issue check</button>
          <button type="button" className="cw-btn secondary" onClick={handlePrintNow}>
            <Printer size={16} /> Print
          </button>
          {lastIssued && (
            <button type="button" className="cw-btn secondary" onClick={() => handlePrint(lastIssued)}>
              <Printer size={16} /> Print last issued check
            </button>
          )}
          <button type="button" className="cw-btn secondary" onClick={() => setShowCalibration((v) => !v)}>
            {showCalibration ? "Hide" : "Adjust"} print position
          </button>
        </div>

        {showCalibration && (
          <>
            <hr className="cw-divider" />
            <h2>Fine-tune print position (mm from top-left)</h2>
            <p className="cw-hint">If the printed fields land in the wrong spot on the check paper, nudge the values below and print again. Settings are remembered.</p>
            <div className="cw-row">
              <div><label className="cw-label">Check width (mm)</label>
                <input className="cw-input" type="number" step="0.1" value={pos.pageWidth} onChange={(e) => setP("pageWidth", e.target.value)} /></div>
              <div><label className="cw-label">Check height (mm)</label>
                <input className="cw-input" type="number" step="0.1" value={pos.pageHeight} onChange={(e) => setP("pageHeight", e.target.value)} /></div>
            </div>
            <div className="cw-row">
              <div><label className="cw-label">Date — top</label>
                <input className="cw-input" type="number" step="0.5" value={pos.dateTop} onChange={(e) => setP("dateTop", e.target.value)} /></div>
              <div><label className="cw-label">Date — left</label>
                <input className="cw-input" type="number" step="0.5" value={pos.dateLeft} onChange={(e) => setP("dateLeft", e.target.value)} /></div>
            </div>
            <div className="cw-row">
              <div><label className="cw-label">Payee — top</label>
                <input className="cw-input" type="number" step="0.5" value={pos.payeeTop} onChange={(e) => setP("payeeTop", e.target.value)} /></div>
              <div><label className="cw-label">Payee — left</label>
                <input className="cw-input" type="number" step="0.5" value={pos.payeeLeft} onChange={(e) => setP("payeeLeft", e.target.value)} /></div>
            </div>
            <div className="cw-row">
              <div><label className="cw-label">Amount — top</label>
                <input className="cw-input" type="number" step="0.5" value={pos.amountTop} onChange={(e) => setP("amountTop", e.target.value)} /></div>
              <div><label className="cw-label">Amount — left</label>
                <input className="cw-input" type="number" step="0.5" value={pos.amountLeft} onChange={(e) => setP("amountLeft", e.target.value)} /></div>
            </div>
            <div className="cw-row">
              <div><label className="cw-label">Words — top</label>
                <input className="cw-input" type="number" step="0.5" value={pos.wordsTop} onChange={(e) => setP("wordsTop", e.target.value)} /></div>
              <div><label className="cw-label">Words — left</label>
                <input className="cw-input" type="number" step="0.5" value={pos.wordsLeft} onChange={(e) => setP("wordsLeft", e.target.value)} /></div>
            </div>
            <div className="cw-actions">
              <button type="button" className="cw-btn secondary" onClick={() => setPos(QUICK_POS_DEFAULT)}>Reset to defaults</button>
            </div>
          </>
        )}
      </form>

      <div className="cw-card cw-preview-wrap">
        <h2>Print preview</h2>
        <div className="quick-preview-outline" style={{ aspectRatio: `${pos.pageWidth} / ${pos.pageHeight}` }}>
          <span className="quick-field date" style={{ top: `${(pos.dateTop / pos.pageHeight) * 100}%`, left: `${(pos.dateLeft / pos.pageWidth) * 100}%` }}>{date ? formatCheckDate(date) : "—"}</span>
          <span className="quick-field payee" style={{ top: `${(pos.payeeTop / pos.pageHeight) * 100}%`, left: `${(pos.payeeLeft / pos.pageWidth) * 100}%` }}>{resolvePayeeName() || "Payee name"}</span>
          <span className="quick-field amount" style={{ top: `${(pos.amountTop / pos.pageHeight) * 100}%`, left: `${(pos.amountLeft / pos.pageWidth) * 100}%` }}>₱{numericAmount > 0 ? money(numericAmount) : "0.00"}</span>
          <span className="quick-field words" style={{ top: `${(pos.wordsTop / pos.pageHeight) * 100}%`, left: `${(pos.wordsLeft / pos.pageWidth) * 100}%` }}>{words || "Amount in words"}</span>
        </div>
        <p className="cw-hint">This shows only what will actually print. Account, check number, and memo are tracked in the Issuance Log but aren't printed since they're already on the check.</p>
      </div>
    </div>
  );
}

function QuickCheckPrintable({ data }) {
  if (!data) return null;
  const { payee, date, amount, words, pos } = data;
  const p = { ...QUICK_POS_DEFAULT, ...pos };
  return (
    <div className="print-quick-page" style={{ width: `${p.pageWidth}mm`, height: `${p.pageHeight}mm` }}>
      <style>{`@page checkpage { size: ${p.pageWidth}mm ${p.pageHeight}mm; margin: 0; }`}</style>
      <span className="quick-field date" style={{ top: `${p.dateTop}mm`, left: `${p.dateLeft}mm` }}>{formatCheckDate(date)}</span>
      <span className="quick-field payee" style={{ top: `${p.payeeTop}mm`, left: `${p.payeeLeft}mm` }}>{payee}</span>
      <span className="quick-field amount" style={{ top: `${p.amountTop}mm`, left: `${p.amountLeft}mm` }}>₱{money(amount)}</span>
      <span className="quick-field words" style={{ top: `${p.wordsTop}mm`, left: `${p.wordsLeft}mm` }}>{words}</span>
    </div>
  );
}

function PayeesTab({ payees, onAdd, onDelete, onUpload, uploadNote, fileInputRef }) {
  const [name, setName] = useState("");
  const [address, setAddress] = useState("");
  const [query, setQuery] = useState("");

  const filtered = useMemo(() => payees.filter((p) => p.name.toLowerCase().includes(query.toLowerCase())), [payees, query]);

  function handleAdd(e) {
    e.preventDefault();
    if (!name.trim()) return;
    onAdd({ name: name.trim(), address: address.trim() });
    setName(""); setAddress("");
  }

  return (
    <div className="cw-grid">
      <div className="cw-card">
        <h2>Add a payee</h2>
        <form onSubmit={handleAdd}>
          <label className="cw-label">Name</label>
          <input className="cw-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="Payee name" />
          <label className="cw-label">Address (optional)</label>
          <input className="cw-input" value={address} onChange={(e) => setAddress(e.target.value)} placeholder="Mailing address" />
          <div className="cw-actions">
            <button className="cw-btn primary" type="submit"><Plus size={16} /> Add payee</button>
          </div>
        </form>

        <hr className="cw-divider" />

        <h2>Import from a file</h2>
        <p className="cw-hint">Upload an Excel/.csv file (a "Name" column, or name in column A) or a Word document (one payee per line).</p>
        <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv,.docx" className="cw-file"
          onChange={(e) => { const f = e.target.files?.[0]; if (f) onUpload(f); e.target.value = ""; }} />
        {uploadNote && <p className="cw-hint upload-note">{uploadNote}</p>}

      <div className="cw-card">
        <h2>Payee log ({payees.length})</h2>
        <div className="cw-search">

function AccountsTab({ accounts, onAdd, onUpdate, onDelete }) {
  const blank = { holderName: "", bankName: "", bankAddress: "", accountNumber: "", nextCheckNumber: 1, balance: "" };
  const [form, setForm] = useState(blank);
  const [error, setError] = useState("");

  function set(field, val) { setForm((f) => ({ ...f, [field]: val })); }

  function handleAdd(e) {
    e.preventDefault();
    setError("");
    if (!form.holderName.trim() || !form.bankName.trim() || !form.accountNumber.trim()) {
      return setError("Account name, bank, and account number are all required.");
    }
    onAdd({
      holderName: form.holderName.trim(), bankName: form.bankName.trim(), bankAddress: form.bankAddress.trim(),
      accountNumber: form.accountNumber.trim(),
      nextCheckNumber: parseInt(form.nextCheckNumber, 10) || 1,
      balance: form.balance === "" ? null : parseFloat(form.balance),
    });
    setForm(blank);
  }

  return (
    <div className="cw-grid">
      <div className="cw-card">
        <h2>Register a check account</h2>
        <form onSubmit={handleAdd}>
          <label className="cw-label">Account name (as printed on checks)</label>
          <input className="cw-input" value={form.holderName} onChange={(e) => set("holderName", e.target.value)} placeholder="e.g. Riverside Hardware LLC" />
          <div className="cw-row">
            <div><label className="cw-label">Bank name</label>
              <input className="cw-input" value={form.bankName} onChange={(e) => set("bankName", e.target.value)} placeholder="e.g. First Union Bank" /></div>
            <div><label className="cw-label">Bank address (optional)</label>
              <input className="cw-input" value={form.bankAddress} onChange={(e) => set("bankAddress", e.target.value)} /></div>
          </div>
          <label className="cw-label">Account number</label>
          <input className="cw-input" value={form.accountNumber} onChange={(e) => set("accountNumber", e.target.value)} />
          <div className="cw-row">
            <div><label className="cw-label">Starting check number</label>
              <input className="cw-input" type="number" min="1" value={form.nextCheckNumber} onChange={(e) => set("nextCheckNumber", e.target.value)} /></div>
            <div><label className="cw-label">Starting balance (optional)</label>
              <input className="cw-input" type="number" step="0.01" value={form.balance} onChange={(e) => set("balance", e.target.value)} placeholder="Leave blank to skip tracking" /></div>
          </div>
          {error && <p className="cw-error">{error}</p>}
          <div className="cw-actions">
            <button className="cw-btn primary" type="submit"><Plus size={16} /> Add account</button>
          </div>
        </form>
      </div>

      <div className="cw-card">
        <h2>Registered accounts ({accounts.length})</h2>
        <table className="cw-table">
          <thead><tr><th>Account</th><th>Bank</th><th>Acct #</th><th>Next check #</th><th>Balance</th><th></th></tr></thead>
          <tbody>
            {accounts.map((a) => (
              <tr key={a.id}>
                <td>{a.holderName}</td>
                <td className="cw-muted">{a.bankName}</td>
                <td className="cw-mono">…{String(a.accountNumber).slice(-4)}</td>
                <td><input className="cw-input cw-inline-input" type="number" value={a.nextCheckNumber}
                  onChange={(e) => onUpdate(a.id, { nextCheckNumber: parseInt(e.target.value, 10) || 1 })} /></td>
                <td>{typeof a.balance === "number" ? `₱${money(a.balance)}` : "—"}</td>
                <td><button className="cw-icon-btn" onClick={() => onDelete(a.id)} title="Delete"><Trash2 size={14} /></button></td>
              </tr>
            ))}
            {!accounts.length && (<tr><td colSpan={6} className="cw-muted cw-empty-row">No accounts registered yet.</td></tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ============ LOG TAB ============

function LogTab({ log, accounts, onUpdateLog, onPrintLog }) {
  const [filterAccount, setFilterAccount] = useState("all");
  const [filterStatus, setFilterStatus] = useState("all");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [sortBy, setSortBy] = useState("date");

  let filtered = filterAccount === "all" ? log : log.filter((r) => r.accountId === filterAccount);
  if (filterStatus !== "all") filtered = filtered.filter((r) => (r.status || "outstanding") === filterStatus);
  if (dateFrom) filtered = filtered.filter((r) => r.date >= dateFrom);
  if (dateTo) filtered = filtered.filter((r) => r.date <= dateTo);

  const sorted = [...filtered].sort((a, b) => {
    if (sortBy === "status") return (a.status || "outstanding").localeCompare(b.status || "outstanding") || (b.date || "").localeCompare(a.date || "");
    return (b.date || "").localeCompare(a.date || "");
  });

  const total = sorted.reduce((s, r) => (r.status === "cancelled" ? s : s + r.amount), 0);

  return (
    <div className="cw-card cw-wide">
      <div className="cw-log-head">
        <h2>Issuance log ({sorted.length})</h2>
        <div className="cw-log-controls">
          <select className="cw-select" value={filterAccount} onChange={(e) => setFilterAccount(e.target.value)}>
            <option value="all">All accounts</option>
            {accounts.map((a) => (<option key={a.id} value={a.id}>{a.holderName}</option>))}
          </select>
          <select className="cw-select" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
            <option value="all">All statuses</option>
            <option value="outstanding">Outstanding</option>
            <option value="presented">Presented</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <select className="cw-select" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
            <option value="date">Sort by date</option>
            <option value="status">Sort by status</option>
          </select>
          <button className="cw-btn secondary" onClick={() => onPrintLog(sorted)}><Printer size={16} /> Print log</button>
        </div>
      </div>
      <div className="cw-log-controls cw-log-daterow">
        <div><label className="cw-label">From date</label>
          <input className="cw-input cw-inline-input" type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} /></div>
        <div><label className="cw-label">To date</label>
          <input className="cw-input cw-inline-input" type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)} /></div>
        {(dateFrom || dateTo) && (
          <button type="button" className="cw-btn secondary" onClick={() => { setDateFrom(""); setDateTo(""); }}>Clear dates</button>
        )}
      </div>
      <table className="cw-table">
        <thead><tr><th>Date</th><th>Check #</th><th>Account</th><th>Payee</th><th>Amount</th><th>Memo</th><th>Status</th><th>Date presented</th></tr></thead>
        <tbody>
          {sorted.map((r) => (
            <tr key={r.id} className={r.status === "cancelled" ? "cw-row-cancelled" : ""}>
              <td>{r.date}</td><td className="cw-mono">#{padCheckNo(r.checkNumber)}</td><td>{r.accountName}</td>
              <td>{r.payee}</td><td>₱{money(r.amount)}</td><td className="cw-muted">{r.memo || "—"}</td>
              <td>
                <select className="cw-select cw-inline-input" value={r.status || "outstanding"}
                  onChange={(e) => onUpdateLog(r.id, { status: e.target.value })}>
                  <option value="outstanding">Outstanding</option>
                  <option value="presented">Presented</option>
                  <option value="cancelled">Cancelled</option>
                </select>
              </td>
              <td>
                <input className="cw-input cw-inline-input" type="date" value={r.datePresented || ""}
                  onChange={(e) => onUpdateLog(r.id, { datePresented: e.target.value })} />
              </td>
            </tr>
          ))}
          {!sorted.length && (<tr><td colSpan={8} className="cw-muted cw-empty-row">No checks issued yet.</td></tr>)}
        </tbody>
        {!!sorted.length && (
          <tfoot><tr><td colSpan={4} className="cw-total-label">Total (excludes cancelled)</td><td colSpan={4} className="cw-total-value">₱{money(total)}</td></tr></tfoot>
        )}
      </table>
    </div>
  );
}

.check-pay-row { display:grid; grid-template-columns: auto 1fr auto; align-items:end; gap:10px; margin-bottom: 8px; }
.check-payee { font-family:'Fraunces', serif; font-size: 16px; border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
.check-amount-box { font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:15px; border: 1.5px solid var(--ink); border-radius:4px; padding: 4px 10px; background:#fff; }
.check-words-row { display:flex; justify-content:space-between; align-items:baseline; border-bottom: 1px solid var(--ink); padding-bottom:4px; margin-bottom: 16px; }
.check-words { font-family:'Fraunces', serif; font-style:italic; font-size: 13.5px; }
.check-dollars-label { font-size: 11px; color: var(--ink-soft); }
.check-bottom-row { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 14px; gap: 20px; }
.check-memo { font-size: 12px; display:flex; flex-direction:column; gap:4px; min-width: 120px; }
.check-sig { display:flex; flex-direction:column; align-items:center; flex:1; }
.check-sig-line { width:100%; border-top: 1px solid var(--ink); margin-bottom: 4px; height: 26px; }
.check-micr { font-family:'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 2px; color: var(--ink); text-align:center; padding-top: 6px; }
.print-area { display:none; }
/* Standard Philippine (PCHC) check size: 8in x 3.5in (203.2mm x 88.9mm) */
@page checkpage { size: 203.2mm 88.9mm; margin: 0; }
@media print {
  .no-print { display:none !important; }
  .print-area { display:block !important; }
  body { background: #fff; }
  .print-check-page, .print-quick-page {
    page: checkpage; width: 203.2mm; height: 88.9mm; box-sizing: border-box; padding: 8mm 10mm; overflow: hidden;
  }
  .print-log-page { padding: 20px; font-family:'Inter', sans-serif; }
  .print-log-page h1 { font-family:'Fraunces', serif; font-size: 20px; margin-bottom: 16px; }
  .print-log-page table { width:100%; border-collapse: collapse; font-size: 12px; }
  .print-log-page th, .print-log-page td { text-align:left; border-bottom: 1px solid #ccc; padding: 6px 8px; }
  .print-log-total { text-align:right; font-weight:600; margin-top: 12px; }
}
.print-quick-page { position: relative; }
.quick-field { position: absolute; white-space: nowrap; }
.quick-field.payee { font-family:'Fraunces', serif; font-size: 15px; }
.quick-field.date { font-family:'IBM Plex Mono', monospace; font-size: 13px; }
.quick-field.amount { font-family:'IBM Plex Mono', monospace; font-weight:600; font-size: 14px; }
.quick-field.words { font-family:'Fraunces', serif; font-style: italic; font-size: 13px; max-width: 170mm; white-space: normal; }
.quick-preview-outline { position: relative; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 1px 3px rgba(31,45,61,0.08); overflow: hidden; }
.quick-preview-outline .quick-field { position: absolute; transform: translateY(-2px); font-size: 11px; white-space: nowrap; max-width: 60%; }
.quick-preview-outline .quick-field.words { white-space: normal; }
`;

ReactDOM.createRoot(document.getElementById("root")).render(<CheckWriterApp />);
</script>
